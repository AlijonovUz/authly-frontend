<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600&display=swap"
      rel="stylesheet"
    />
    <title>Authly</title>
    <script>
      (function() {
        try {
          var token = localStorage.getItem('authly.access');
          if (!token) return;
          var search = window.location.search;
          if (!search) return;
          var params = new URLSearchParams(search);
          var clientId = params.get('client_id');
          var redirectUri = params.get('redirect_uri');
          if (!clientId || !redirectUri) return;
          var userRaw = localStorage.getItem('authly.user');
          if (userRaw) {
            var u = JSON.parse(userRaw);
            if (!u.first_name || !u.last_name || !u.region_info || !u.district_info || !u.birth_date) {
              return;
            }
          }
          var scope = params.get('scope') || 'read';
          var state = params.get('state');
          fetch('https://api.authly.uz/api/v1/sso/authorize/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
              client_id: clientId,
              redirect_uri: redirectUri,
              scope: scope
            })
          })
          .then(function(res) {
            if (!res.ok) throw new Error();
            return res.json();
          })
          .then(function(resData) {
            var data = resData && resData.data ? resData.data : resData;
            var target = data.redirect_url || data.redirect_to || data.url || data.location;
            if (!target && data.code) {
              var parsedUrl = new URL(redirectUri);
              parsedUrl.searchParams.set('code', data.code);
              if (state) parsedUrl.searchParams.set('state', state);
              target = parsedUrl.href;
            }
            if (target) {
              window.location.replace(target);
            }
          })
          .catch(function() {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
